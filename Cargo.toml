[workspace]
resolver = "2"
members = ["server", "pusher", "proto"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
bytes = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
